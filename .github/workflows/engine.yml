name: engine

on:
  schedule:
    - cron: "30 2 * * *"   # 05:30 بتوقيت الرياض
    - cron: "30 15 * * *"  # 18:30 بتوقيت الرياض
  workflow_dispatch:
    inputs:
      slot:
        description: "morning أو evening"
        default: "morning"
      force:
        description: "1 = ولّد ولو لم يكن مجدولًا"
        default: "1"
      note:
        description: "ملاحظة سيدي للكاتب"
        default: ""

permissions:
  contents: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: الأدوات
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: المعرفة الخاصة (من الأسرار)
        env:
          KNOWLEDGE: ${{ secrets.KNOWLEDGE }}
        run: echo "$KNOWLEDGE" | base64 -d | tar xz -C knowledge

      - name: توليد المنشور
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          MODEL: ${{ vars.MODEL || 'claude-opus-5-5' }}
          SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || (github.event.schedule == '30 2 * * *' && 'morning' || 'evening') }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == '1' && '1' || '' }}
          NOTE: ${{ inputs.note }}
        run: python engine/generate.py

      - name: حفظ السجل
        run: |
          git config user.name "engine-bot"
          git config user.email "engine-bot@users.noreply.github.com"
          git add history/
          git diff --cached --quiet || (git commit -m "سجل المنشورات" && git push)

      - name: تنبيه عند الفشل
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_CHAT_ID}" \
            --data-urlencode "text=⚠️ تعذّر توليد منشور اليوم. التفاصيل: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
