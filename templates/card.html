<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:T;src:url(../assets/fonts/thmanyahsans-Regular.woff2);font-weight:400}
@font-face{font-family:T;src:url(../assets/fonts/thmanyahsans-Medium.woff2);font-weight:500}
@font-face{font-family:T;src:url(../assets/fonts/thmanyahsans-Bold.woff2);font-weight:700}
@font-face{font-family:T;src:url(../assets/fonts/thmanyahsans-Black.woff2);font-weight:900}
@font-face{font-family:TD;src:url(../assets/fonts/thmanyahserifdisplay-Black.woff2);font-weight:900}
:root{--navy:#0A1931;--navy2:#12284A;--teal:#00BFD1;--gold:#FFC93C;--ink:#0A1931;--paper:#F4F8FC;--muted:#5B6B82;--g:#00BFD1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
body{font-family:T;background:var(--navy);color:#fff;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;
  background:
   radial-gradient(900px 600px at 85% -10%, #123A63 0%, transparent 60%),
   radial-gradient(700px 520px at -10% 110%, #0E3550 0%, transparent 60%),
   linear-gradient(180deg,#0A1931,#0B1D3A)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:54px 54px}
.wrap{position:absolute;inset:64px 64px 56px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:24px}
.kicker{display:inline-flex;align-items:center;gap:14px;font-weight:700;font-size:30px;color:#CFE6F5}
.chip{background:var(--g);color:var(--navy);font-weight:900;font-size:28px;padding:10px 24px;border-radius:999px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--gold)}
h1{font-family:TD;font-weight:900;font-size:86px;line-height:1.18;margin-top:40px;letter-spacing:0}
h1 em{font-style:normal;color:var(--gold)}
.lead{font-size:38px;line-height:1.6;color:#D8E6F3;margin-top:22px;font-weight:500}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px;padding:40px 0 30px}
.card{background:var(--paper);color:var(--ink);border-radius:36px;padding:44px 48px;position:relative}
.card .lbl{font-weight:900;font-size:30px;color:var(--muted);margin-bottom:12px}
.card p{font-size:44px;line-height:1.55;font-weight:700}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
/* concept */
.big{align-self:center;font-family:T;font-weight:900;font-size:120px;color:var(--navy);background:var(--gold);padding:26px 64px;border-radius:40px;box-shadow:0 18px 0 #C99A1A;line-height:1.1;text-align:center;max-width:100%}
.big.txt{font-size:84px}
.tip{display:flex;gap:22px;align-items:flex-start;border:3px solid #ffffff22;border-radius:30px;padding:30px 36px;font-size:36px;line-height:1.55;color:#E7F1FA;font-weight:500}
.tip b{color:var(--teal);font-weight:900;white-space:nowrap}
/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.cmp .card{padding:40px 38px}
.cmp h3{font-size:46px;font-weight:900;margin-bottom:18px;display:flex;gap:14px;align-items:center}
.cmp h3 i{width:22px;height:22px;border-radius:7px;background:var(--g);display:inline-block}
.cmp .card:nth-child(2) h3 i{background:var(--gold)}
.cmp li{list-style:none;font-size:40px;line-height:1.5;font-weight:700;padding:14px 0;border-top:2px dashed #0A193122}
.mini{margin:6px 0 14px}.mini .blk{font-size:30px;padding:14px 20px 18px;white-space:normal;line-height:1.5}.mini .blk::before{display:none}.mini .blk .in{padding:0 14px}
.verdict{background:var(--teal);color:var(--navy);border-radius:30px;padding:30px 40px;font-size:40px;font-weight:900;line-height:1.5;text-align:center}
/* steps */
.steps{display:flex;flex-direction:column;gap:16px;position:relative}
.step{display:flex;gap:30px;align-items:center;background:var(--paper);color:var(--ink);border-radius:32px;padding:26px 40px}
.step .n{flex:none;width:80px;height:80px;border-radius:28px;background:var(--navy);color:var(--gold);font-weight:900;font-size:54px;display:grid;place-items:center}
.step h4{font-size:44px;font-weight:900;line-height:1.3}
.step p{font-size:34px;line-height:1.5;color:#33435A;font-weight:500;margin-top:6px}
/* mistake */
.mk{display:flex;flex-direction:column;gap:26px}
.mk .card{display:flex;gap:30px;align-items:flex-start}
.mk .ic{flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:60px;color:#fff}
.mk .bad .ic{background:#D9483B}
.mk .good .ic{background:#17915F}
.mk .bad{background:#FDEDEB}
.mk .good{background:#E7F6EE}
.why{font-size:36px;line-height:1.6;color:#E7F1FA;font-weight:500;border-right:8px solid var(--gold);padding:6px 30px 6px 0}
/* scratch */
.stage{background:var(--paper);border-radius:36px;padding:48px 52px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.blk{font-family:T;font-weight:700;font-size:46px;color:#fff;padding:20px 34px 26px;border-radius:14px;position:relative;margin-bottom:-6px;box-shadow:inset 0 -6px 0 #0000002a;white-space:nowrap}
.blk::before{content:"";position:absolute;top:-1px;right:44px;width:46px;height:12px;background:var(--paper);border-radius:0 0 12px 12px}
.blk:first-child::before{display:none}
.blk.hat{border-radius:44px 44px 14px 14px;padding-top:30px}
.blk .in{display:inline-block;background:#fff;color:#333;border-radius:999px;padding:2px 22px;margin:0 8px;font-weight:700}
.cwrap{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:-6px}
.cwrap>.ctop{margin-bottom:0;box-shadow:none;border-radius:14px 14px 0 14px;padding-bottom:24px}
.cbody{display:flex;flex-direction:column;align-items:flex-start;border-right:44px solid #FFAB19;min-height:56px;padding:0 0 6px}
.k-events .cbody{border-color:#FFBF00}.k-motion .cbody{border-color:#4C97FF}.k-looks .cbody{border-color:#9966FF}
.cbot{width:240px;height:40px;border-radius:0 0 14px 14px;box-shadow:inset 0 -6px 0 #0000002a;margin-bottom:-6px}
.c-events{background:#FFBF00;color:#3a2a00}.c-events .in{color:#3a2a00}
.c-motion{background:#4C97FF}.c-looks{background:#9966FF}.c-sound{background:#CF63CF}
.c-control{background:#FFAB19;color:#3a2a00}.c-sensing{background:#5CB1D6}.c-operators{background:#59C059}
.c-variables{background:#FF8C1A}.c-pen{background:#0FBD8C}.c-myblocks{background:#FF6680}
.cap{font-size:38px;line-height:1.6;color:#E7F1FA;font-weight:500}

/* predict */
.task{background:#ffffff12;border:2px solid #ffffff26;border-radius:26px;padding:22px 30px;font-size:34px;line-height:1.55;color:#E7F1FA;font-weight:500}
.task b,.task em{color:var(--gold);font-style:normal;font-weight:700}
.grid6{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.pq{background:var(--paper);border-radius:28px;padding:18px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
.pq .no{position:absolute;top:14px;right:18px;width:46px;height:46px;border-radius:14px;background:var(--navy);color:var(--gold);font-weight:900;font-size:28px;display:grid;place-items:center}
.op{display:inline-flex;align-items:center;gap:8px;background:#59C059;border-radius:999px;padding:8px 12px;color:#fff;font-weight:900;font-size:34px;box-shadow:inset 0 -5px 0 #0000002a;direction:rtl}
.op .op{padding:6px 10px;font-size:30px;background:#59C059;border:3px solid #2F8F2F}
.sym{font-size:44px;font-weight:900;padding:0 6px;line-height:1;font-family:Arial,sans-serif}
.num{background:#fff;color:#333;border-radius:999px;min-width:58px;padding:2px 14px;text-align:center;font-weight:900;font-size:32px}
.ans{font-weight:900;font-size:40px;color:var(--navy);background:var(--gold);border-radius:16px;padding:4px 26px;min-width:120px;text-align:center}
.ans.q{background:#E4ECF5;color:#9FB0C4}
.blk.hl{outline:7px solid var(--gold);outline-offset:4px}
.flag{display:inline-block;width:42px;height:42px;vertical-align:middle;margin:0 6px}
/* statement */
.st{font-family:TD;font-weight:900;font-size:96px;line-height:1.3}
.st em{font-style:normal;color:var(--gold)}
.sub{font-size:40px;line-height:1.6;color:#D8E6F3;font-weight:500}
.bar{width:140px;height:12px;border-radius:8px;background:var(--teal)}
footer{display:flex;align-items:center;justify-content:space-between;border-top:2px solid #ffffff1c;padding-top:28px}
.brand{display:flex;align-items:center;gap:18px;font-weight:900;font-size:34px}
.logo{width:84px;height:84px;border-radius:50%;overflow:hidden;border:4px solid var(--gold);background:#0D2748}
.logo img{width:104%;height:104%;margin:-2%;object-fit:cover}
.tag{font-size:28px;color:#9FB6CC;font-weight:500}
.link{direction:ltr;font-weight:900;font-size:32px;color:var(--teal)}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<div class="wrap" id="root"></div>
<script>
const GRADE={g4:{n:'الصف الرابع',c:'#00B4CC'},g5:{n:'الصف الخامس',c:'#1FB574'},g6:{n:'الصف السادس',c:'#F08A1C'}};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// *نجمتان* = تمييز ذهبي ، `رمز` = نص لاتيني معزول
const fmt=s=>esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<span class="ltr">$1</span>');
function render(d){
  const g=GRADE[d.grade];
  if(g) document.documentElement.style.setProperty('--g',g.c);
  const head=`<header><div class="kicker">${g?`<span class="chip">${g.n}</span>`:'<span class="dot"></span>'}<span>${esc(d.kicker)}</span></div></header>`;
  let mid='';
  if(d.layout==='concept'){
    const isTxt=/[؀-ۿ]/.test(d.big||'');
    mid=`<h1>${fmt(d.title)}</h1><div class="body"><div class="big ${isTxt?'txt':''}">${fmt(d.big)}</div><div class="card"><p>${fmt(d.explain)}</p></div>${d.tip?`<div class="tip"><b>للمعلم</b><span>${fmt(d.tip)}</span></div>`:''}</div>`;
  }else if(d.layout==='compare'){
    const mb=b=>b?`<div class="mini"><div class="blk c-${b.cat}">${esc(b.text).replace(/\[([^\]]*)\]/g,'<span class="in">$1</span>')}</div></div>`:'';
    const col=c=>`<div class="card"><h3><i></i>${fmt(c.label)}</h3>${mb(c.block)}<ul>${(c.points||[]).map(p=>`<li>${fmt(p)}</li>`).join('')}</ul></div>`;
    mid=`<h1>${fmt(d.title)}</h1><div class="body"><div class="cmp">${col(d.right)}${col(d.left)}</div>${d.verdict?`<div class="verdict">${fmt(d.verdict)}</div>`:''}</div>`;
  }else if(d.layout==='steps'){
    mid=`<h1>${fmt(d.title)}</h1><div class="body"><div class="steps">${d.steps.map((s,i)=>`<div class="step"><div class="n">${'١٢٣٤'[i]}</div><div><h4>${fmt(s.t)}</h4>${s.d?`<p>${fmt(s.d)}</p>`:''}</div></div>`).join('')}</div>${d.task?`<div class="task">${fmt(d.task)}</div>`:''}</div>`;
  }else if(d.layout==='mistake'){
    mid=`<h1>${fmt(d.title)}</h1><div class="body mk"><div class="card bad"><div class="ic">✕</div><div><div class="lbl">الخطأ الشائع</div><p>${fmt(d.wrong)}</p></div></div><div class="card good"><div class="ic">✓</div><div><div class="lbl">الصواب</div><p>${fmt(d.right)}</p></div></div>${d.why?`<div class="why">${fmt(d.why)}</div>`:''}</div>`;
  }else if(d.layout==='scratch'){
    const FLAG='<svg class="flag" viewBox="0 0 24 24"><path d="M5 3v18" stroke="#2E7D32" stroke-width="2.5"/><path d="M6 4h12l-3 4 3 4H6z" fill="#4CBF56" stroke="#2E7D32" stroke-width="1.2"/></svg>';
    const txt=b=>esc(b.text).replace(/\[([^\]]*)\]/g,'<span class="in">$1</span>').replace('{flag}',FLAG);
    // يبني المقطع شجرة: لبنة التحكم تحتضن ما بعدها من لبنات أعمق منها (شكل C كما في سكراتش)
    const build=(arr,lvl)=>{let h='';while(arr.length&&(arr[0].indent||0)>=lvl){const b=arr.shift();
      if(arr.length&&(arr[0].indent||0)>(b.indent||0)){h+=`<div class="cwrap k-${b.cat}"><div class="blk c-${b.cat} ctop">${txt(b)}</div><div class="cbody">${build(arr,(b.indent||0)+1)}</div><div class="cbot c-${b.cat}"></div></div>`;}
      else h+=`<div class="blk c-${b.cat} ${b.hat?'hat':''} ${b.hl?'hl':''}">${txt(b)}</div>`;}return h;};
    mid=`<h1>${fmt(d.title)}</h1><div class="body">${d.task?`<div class="task">${fmt(d.task)}</div>`:''}<div class="stage">${build(d.blocks.map(b=>({...b})),0)}</div>${d.caption?`<div class="cap">${fmt(d.caption)}</div>`:''}</div>`;
  }else if(d.layout==='predict'){
    const rep=e=>typeof e==='object'?`<span class="op">${rep(e.a)}<span class="sym">${esc(e.op)}</span>${rep(e.b)}</span>`:`<span class="num">${esc(e)}</span>`;
    mid=`<h1>${fmt(d.title)}</h1><div class="body" style="gap:24px">${d.task?`<div class="task">${fmt(d.task)}</div>`:''}<div class="grid6">${d.items.map((it,i)=>`<div class="pq"><div class="no">${'١٢٣٤٥٦'[i]}</div><div style="margin-top:26px">${rep(it.e)}</div><div class="ans ${d.answers?'':'q'}">${d.answers?esc(it.r):'؟'}</div></div>`).join('')}</div></div>`;
  }else{ // statement
    mid=`<div class="body" style="gap:44px"><div class="bar"></div><div class="st">${fmt(d.title)}</div>${d.sub?`<div class="sub">${fmt(d.sub)}</div>`:''}</div>`;
  }
  const foot=`<footer><div class="brand"><div class="logo"><img src="../assets/logo-512.png"></div><div>المعلم مشعل<div class="tag">مستقبل أفضل بمهارات رقمية</div></div></div><div class="link">${d.link?esc(d.link):'@Teacher_Meshal'}</div></footer>`;
  document.getElementById('root').innerHTML=head+mid+foot;
}
render(window.DATA||{});
</script>
</body>
</html>
